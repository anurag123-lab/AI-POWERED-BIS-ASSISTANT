{% extends 'auth_layout.html' %}
{% set active_step = 2 %}

{% block title %}Verify Email — BIS Compliance Copilot{% endblock %}

{% block auth_form %}
  <span class="eyebrow-tag">Email verification</span>
  <h2>Enter your code</h2>
  <p class="auth-sub">We sent a 6-digit code to <strong style="color:var(--text-secondary);">{{ email }}</strong>.</p>

  <form method="POST" action="{{ url_for('register_verify') }}" style="margin-top:18px;">
    <div class="form-field">
      <label class="form-label" for="otp_code">6-digit verification code</label>
      <input class="form-input" id="otp_code" type="text" name="otp_code" required autofocus
             inputmode="numeric" pattern="[0-9 ]{6,8}" maxlength="8" autocomplete="one-time-code"
             placeholder="------"
             style="letter-spacing:10px; text-align:center; font-size:1.4rem; font-weight:700;">
    </div>
    <div class="auth-actions">
      <button type="submit" class="btn-pill btn-orange">Verify &amp; create account</button>
    </div>
  </form>

  <form method="POST" action="{{ url_for('register_resend_otp') }}" style="margin-top:12px;">
    <button type="submit" class="btn-pill btn-dark-outline" style="width:100%;">Resend code</button>
  </form>

  <div class="auth-alt-link">
    Wrong email? <a href="{{ url_for('register') }}">Start over</a>
  </div>
{% endblock %}
